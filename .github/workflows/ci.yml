name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify
      - name: Packaging dry run
        if: matrix.node == '24'
        run: npm pack --dry-run

  install-smoke:
    name: install smoke (latest DSH)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: npm ci

      - name: Pack the plugin tarball
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm pack >/dev/null
          test -f "dsh-sound-notify-${VERSION}.tgz"
          echo "TARBALL=dsh-sound-notify-${VERSION}.tgz" >> "$GITHUB_ENV"

      - name: Install the latest published DSH
        run: |
          npm install --global @deepseek-ai/dsh@latest --no-fund --no-audit
          dsh --version

      - name: Fresh web profile + official plugin install
        run: |
          dsh --profile ci-web --from-default-profile web --dump-config >/dev/null
          dsh plugin --profile ci-web add "$PWD/$TARBALL"
          dsh --profile ci-web --dump-config > ci-web.dump.yml
          grep -q "name: dsh-sound-notify" ci-web.dump.yml
          grep -q "dsh-sound-notify" "${DSH_HOME:-$HOME/.dsh}/profiles/ci-web/package.json"
          test -f "${DSH_HOME:-$HOME/.dsh}/profiles/ci-web/node_modules/dsh-sound-notify/lib/client.js"
          test -f "${DSH_HOME:-$HOME/.dsh}/profiles/ci-web/node_modules/dsh-sound-notify/sounds/success.aac"
